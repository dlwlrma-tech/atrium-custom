name: build-portable

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build portable package
        shell: pwsh
        run: ./tools/build.ps1 -Zip -Ninja
      - name: Upload Atrium-win-x64 zip
        uses: actions/upload-artifact@v4
        with:
          name: Atrium-custom-win-x64
          path: dist/Atrium-*-win-x64.zip
          if-no-files-found: error
